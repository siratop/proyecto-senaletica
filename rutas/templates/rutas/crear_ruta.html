{% if form.errors %}
    <div style="background: #fee2e2; color: #991b1b; padding: 15px; border-radius: 8px; border: 1px solid #f87171; margin-bottom: 20px;">
        <strong>¡Django rechazó el formulario! Errores detectados:</strong>
        <ul>
            {% for field in form %}
                {% for error in field.errors %}
                    <li><b>{{ field.label }}:</b> {{ error }}</li>
                {% endfor %}
            {% endfor %}
            {% for error in form.non_field_errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    </div>
{% endif %}
