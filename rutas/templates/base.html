<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeñalÉtica+ | Movilidad Inclusiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Urbanist:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="manifest" href="{% url 'manifest' %}">
    <meta name="theme-color" content="#2563eb">
    <style>
        :root { --primary: #0d9488; --primary-dark: #0f172a; --bg: #f8fafc; --text-main: #1e293b; --text-muted: #64748b; --white: #ffffff; --danger: #ef4444; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text-main); margin: 0; padding: 0; display: flex; flex-direction: column; min-height: 100vh; }
        .main-wrapper { width: 100%; max-width: 1100px; margin: 0 auto; padding: 20px; box-sizing: border-box; flex-grow: 1; }
        
        /* HEADER ACTUALIZADO (Para contener el logo a la izquierda y el botón a la derecha) */
        .global-header { 
            background-color: var(--white); 
            border-bottom: 1px solid #e2e8f0; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .logo-text { font-family: 'Urbanist', sans-serif; font-size: 24px; color: var(--primary-dark); margin: 0; }
        .logo-text span { color: var(--primary); }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }

        .btn-base {
            flex: 1;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .btn-primary { background: #0d9488; color: white; }
        .btn-primary:hover { background: #0f766e; }

        .btn-cancel { background: #94a3b8; color: white; }
        .btn-cancel:hover { background: #64748b; }

        .btn-danger { background: #ef4444; color: white; }
        .btn-danger:hover { background: #dc2626; }

        /* MODO ALTO CONTRASTE */
        body.alto-contraste {
            background-color: #121212 !important;
            color: #ffeb3b !important; 
        }
        body.alto-contraste div, 
        body.alto-contraste span, 
        body.alto-contraste p, 
        body.alto-contraste h1, 
        body.alto-contraste h2, 
        body.alto-contraste h3,
        body.alto-contraste th,
        body.alto-contraste td {
            background-color: #121212 !important;
            color: #ffeb3b !important;
            border-color: #ffeb3b !important;
        }
        body.alto-contraste header.global-header {
            background-color: #000000 !important;
            border-bottom: 2px solid #ffeb3b !important;
        }
        body.alto-contraste button, 
        body.alto-contraste a.btn {
            background-color: #ffeb3b !important;
            color: #000000 !important;
            border: 2px solid #ffeb3b !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body>
    
    <header class="global-header">
        <h1 class="logo-text">Señal<span>Ética+</span></h1>
        
        <button id="btn-contraste" onclick="toggleContraste()" style="background: #1e293b; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: bold; transition: 0.2s;">
            <i class="fa-solid fa-circle-half-stroke" style="margin-right: 5px; color: #ffeb3b;"></i> Alto Contraste
        </button>
    </header>

    {% include 'includes/navbar.html' %}

    {% if messages %}
        <div style="margin: 20px auto; max-width: 800px;">
            {% for message in messages %}
                <div style="padding: 15px; border-radius: 8px; border: 1px solid #f87171; background: #fee2e2; color: #991b1b; text-align: center; font-weight: bold;">
                    <i class="fa-solid fa-triangle-exclamation"></i> {{ message }}
                </div>
            {% endfor %}
        </div>
    {% endif %}

    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <footer style="text-align: center; padding: 20px; color: var(--text-muted); font-size: 13px;">
        SeñalÉtica+ © 2026 | Guayana | UNEG
    </footer>

    <script>
        // Lógica de la PWA (Service Worker)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('¡Service Worker registrado con éxito!', reg.scope))
                    .catch(err => console.error('Error al registrar el Service Worker:', err));
            });
        }

        // Lógica del Botón de Alto Contraste
        document.addEventListener("DOMContentLoaded", function() {
            // Revisa la memoria del navegador al cargar la página
            if (localStorage.getItem("altoContraste") === "activado") {
                document.body.classList.add("alto-contraste");
            }
        });

        function toggleContraste() {
            const body = document.body;
            body.classList.toggle("alto-contraste");
            
            // Guarda la decisión para que no se borre si cambia de página
            if (body.classList.contains("alto-contraste")) {
                localStorage.setItem("altoContraste", "activado");
            } else {
                localStorage.setItem("altoContraste", "desactivado");
            }
        }

        function leerTextoEnVozAlta(texto) {
            // Cancelamos si el teléfono ya estaba leyendo otra cosa
            window.speechSynthesis.cancel(); 

            const lectura = new SpeechSynthesisUtterance(texto);
            lectura.lang = 'es-ES'; // Español
            lectura.rate = 1.0;     // Velocidad normal
            
            // Le decimos al navegador que hable
            window.speechSynthesis.speak(lectura);
        }
    </script>
</body>
</html>
