{% extends 'base.html' %}
{% block content %}

<div style="max-width: 600px; margin: 0 auto;">
    
    <a href="{% url 'panel_admin_amigable' %}" style="display: inline-block; margin-bottom: 20px; color: #475569; text-decoration: none; font-weight: bold; font-size: 14px; transition: 0.2s;">
        <i class="fa-solid fa-arrow-left"></i> Volver al Centro de Control
    </a>

    <div style="background: white; border: 1px solid #e2e8f0; border-radius: 12px; margin-bottom: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
        <div style="padding: 20px; border-bottom: 1px solid #e2e8f0;">
            <h2 style="margin: 0; color: #4338ca; font-size: 18px; display: flex; align-items: center; gap: 10px;">
                <i class="fa-solid fa-id-card-clip"></i> Asignar Tarjeta Inteligente (NFC)
            </h2>
            <p style="margin: 5px 0 0 0; color: #64748b; font-size: 13px;">
                Vincule una nueva tarjeta de pasaje electrónico al perfil de un usuario ciudadano.
            </p>
        </div>
        
        <div style="padding: 20px;">
            <form method="POST" action="{% url 'guardar_nfc' %}">
                {% csrf_token %}
                
                <div style="margin-bottom: 15px;">
                    <label style="display: block; font-size: 13px; font-weight: bold; color: #334155; margin-bottom: 5px;">Seleccionar Usuario:</label>
                    <select name="usuario_id" required style="width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; background: #f8fafc; font-size: 14px;">
                        <option value="">-- Busque un usuario --</option>
                        {% for usuario in usuarios %}
                            <option value="{{ usuario.id }}">{{ usuario.username }} - {{ usuario.first_name }} {{ usuario.last_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-size: 13px; font-weight: bold; color: #334155; margin-bottom: 5px;">Código Único NFC (UID):</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="uid-nfc" name="codigo_nfc" readonly required placeholder="Presione Generar..." style="flex-grow: 1; padding: 10px; border-radius: 6px; border: 1px solid #cbd5e1; outline: none; background: #f1f5f9; font-size: 14px; font-family: monospace; color: #475569; letter-spacing: 1px;">
                        
                        <button type="button" onclick="generarCodigoNFC()" style="background: #e0e7ff; color: #4338ca; border: 1px solid #c7d2fe; padding: 0 15px; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 13px;">
                            <i class="fa-solid fa-rotate"></i> Generar
                        </button>
                    </div>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" style="background: #4f46e5; color: white; border: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                        <i class="fa-solid fa-link"></i> Vincular Tarjeta
                    </button>
                    <a href="{% url 'panel_admin_amigable' %}" style="background: white; color: #475569; border: 1px solid #cbd5e1; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer; text-decoration: none;">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function generarCodigoNFC() {
        // 1. Generamos un Token UUID v4 aleatorio y seguro
        let tokenUnico = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
            var r = Math.random() * 16 | 0, v = c == 'x' ? r : (r & 0x3 | 0x8);
            return v.toString(16);
        });

        // 2. Construimos la URL completa que se grabará en el NFC
        // Nota: En producción cambiarías "midominio.com" por tu dominio real
        let urlSOS = `https://senaleticaplus.com/sos/alerta/${tokenUnico}`;
        
        // 3. Lo mostramos en el input para que el admin lo copie y lo vincule
        document.getElementById('uid-nfc').value = urlSOS;
    }

    // Generar automáticamente al cargar
    document.addEventListener("DOMContentLoaded", function() {
        generarCodigoNFC();
    });
</script>

{% endblock %}
